# Publish @solesius-oss/click-clack-mcp to npm.
#
# Trigger: push a tag matching `click-clack-mcp-v*` (e.g. click-clack-mcp-v0.1.0).
# Flow:
#   1. Build libclickclack.so / .dylib on linux-x64 and macos-arm64.
#   2. Upload each prebuild as an artifact.
#   3. Collect all artifacts on the publisher job, drop them under
#      bindings/bun/native/<platform>-<arch>/, then `npm publish`.
#
# Secrets required:
#   NPM_TOKEN — automation token with publish access to @solesius-oss/click-clack-mcp.
name: publish-click-clack-mcp

on:
  push:
    tags:
      - 'click-clack-mcp-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'If true, run npm publish --dry-run'
        required: false
        default: 'true'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: macos-14
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential ninja-build \
            gcc-13 g++-13 \
            librocksdb-dev
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-13 130
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-13 130

      - name: Install system deps (macOS)
        if: matrix.platform == 'darwin'
        # rocksdb is required at *build* time (headers + link against
        # librocksdb.dylib). The post-build "Bundle RocksDB dylib" step
        # then copies the resulting librocksdb.N.dylib into the prebuild
        # so consumers don't need Homebrew RocksDB at runtime.
        run: brew install cmake ninja pkgconf rocksdb

      - name: Export Homebrew paths (macOS)
        if: matrix.platform == 'darwin'
        run: |
          prefix="$(brew --prefix)"
          echo "CMAKE_PREFIX_PATH=$prefix" >> "$GITHUB_ENV"
          echo "CMAKE_INCLUDE_PATH=$prefix/include" >> "$GITHUB_ENV"
          echo "CMAKE_LIBRARY_PATH=$prefix/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$prefix/lib/pkgconfig:$prefix/share/pkgconfig" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I$prefix/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$prefix/lib" >> "$GITHUB_ENV"

      - name: Configure & build libclickclack
        env:
          CC:  ${{ matrix.platform == 'linux' && 'gcc-13' || '' }}
          CXX: ${{ matrix.platform == 'linux' && 'g++-13' || '' }}
        run: |
          # macos-14 ships CMake 4.x which refuses cmake_minimum_required < 3.5.
          # google/crc32c 1.1.2 still declares VERSION 3.1, so bump the floor
          # policy-wise via the top-level CMake flag (honoured for all nested
          # projects, including FetchContent subprojects).
          cmake -S . -B build-ffi \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH:-}" \
            -DCMAKE_INCLUDE_PATH="${CMAKE_INCLUDE_PATH:-}" \
            -DCMAKE_LIBRARY_PATH="${CMAKE_LIBRARY_PATH:-}" \
            -DCC_BUILD_TESTS=OFF \
            -DCC_BUILD_SERVER=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-ffi -j --target click_clack_ffi

      - name: Bundle RocksDB dylib into macOS prebuild
        if: matrix.platform == 'darwin'
        run: |
          set -euxo pipefail
          out_dir="bindings/bun/native/${{ matrix.platform }}-${{ matrix.arch }}"
          mkdir -p "$out_dir"
          cp build-ffi/libclickclack.dylib "$out_dir/"

          # Recursively walk libclickclack.dylib's dynamic dependency tree
          # and, for every dep that lives outside /usr/lib and /System/Library,
          # copy it into $out_dir and rewrite install names so the bundled
          # library is used at runtime. This covers RocksDB (libclickclack
          # directly links) *and* its transitive Homebrew deps (gflags,
          # snappy, lz4, zstd, bz2, ...) so consumers don't need Homebrew at
          # all.
          declare -A bundled
          bundle_deps() {
            local target="$1"
            local deps
            deps="$(otool -L "$target" | tail -n +2 | awk '{print $1}')"
            for dep in $deps; do
              # Skip self-reference and system libs shipped with macOS
              case "$dep" in
                @*|/usr/lib/*|/System/Library/*)
                  continue
                  ;;
              esac
              if [ ! -f "$dep" ]; then
                echo "warning: dep not found on disk: $dep" >&2
                continue
              fi
              local base
              base="$(basename "$dep")"
              # Rewrite the reference inside $target either way
              install_name_tool -change "$dep" "@loader_path/$base" "$target" || true
              if [ -z "${bundled[$base]:-}" ]; then
                bundled[$base]=1
                cp -f "$dep" "$out_dir/$base"
                chmod u+w "$out_dir/$base"
                install_name_tool -id "@loader_path/$base" "$out_dir/$base" || true
                # Recurse into the newly bundled dep
                bundle_deps "$out_dir/$base"
              fi
            done
          }

          bundle_deps "$out_dir/libclickclack.dylib"

          # Ad-hoc re-sign everything we modified so macOS' integrity check
          # doesn't reject the patched mach-o images at dlopen time.
          for f in "$out_dir"/*.dylib; do
            codesign --force --sign - "$f" || true
          done

          echo "── Final bundle ─────────────────────────────"
          ls -la "$out_dir"
          echo "── libclickclack.dylib deps ─────────────────"
          otool -L "$out_dir/libclickclack.dylib"
          echo "── Verify no /opt/homebrew leaks ────────────"
          if otool -L "$out_dir"/*.dylib | grep -E '/opt/homebrew|/usr/local/(opt|Cellar)' ; then
            echo "ERROR: bundle still references Homebrew paths" >&2
            exit 1
          fi

      - name: Stage prebuild
        if: matrix.platform != 'darwin'
        run: |
          mkdir -p bindings/bun/native/${{ matrix.platform }}-${{ matrix.arch }}
          cp build-ffi/libclickclack.so bindings/bun/native/${{ matrix.platform }}-${{ matrix.arch }}/

      - name: Upload prebuild
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.platform }}-${{ matrix.arch }}
          path: bindings/bun/native/${{ matrix.platform }}-${{ matrix.arch }}/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download all prebuilds
        uses: actions/download-artifact@v4
        with:
          path: bindings/bun/native/
          pattern: prebuild-*
          merge-multiple: false

      - name: Flatten prebuild layout
        working-directory: bindings/bun/native
        run: |
          set -euxo pipefail
          for dir in prebuild-*; do
            plat_arch="${dir#prebuild-}"
            mkdir -p "$plat_arch"
            mv "$dir"/* "$plat_arch"/
            rmdir "$dir"
          done
          ls -la .
          find . -type f

      - name: Pack tarball (sanity check)
        working-directory: bindings/bun
        # prepack runs and finds the already-staged native/<plat>-<arch>/lib
        # so it exits quickly without rebuilding.
        run: npm pack --dry-run

      - name: Publish
        working-directory: bindings/bun
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CLICK_CLACK_PREBUILD: skip
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            npm publish --dry-run --access public
          else
            npm publish --access public
          fi
