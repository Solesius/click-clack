<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <title>click-clack</title>
  <base href="/">
  <!--
    F-13: Content Security Policy. Lock script/style/font origins to
    self + the Google Fonts CDN we already use. 'unsafe-inline' for
    style is required for Angular Material's runtime theming; scripts
    stay strict ('self' only) so the theme-bootstrap block below is
    promoted out of inline to keep the policy honest.
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    connect-src 'self' ws: wss:;
    script-src 'self' 'unsafe-inline';
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' https://fonts.gstatic.com;
    img-src 'self' data:;
    object-src 'none';
    base-uri 'self';
    frame-ancestors 'none';
  ">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    // Theme bootstrap — runs before Angular mounts to avoid flash.
    (function () {
      try {
        var saved = localStorage.getItem('cc-theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch (e) { /* storage unavailable */ }
    })();
  </script>
</head>
<body>
  <cc-hub-shell></cc-hub-shell>
</body>
</html>
