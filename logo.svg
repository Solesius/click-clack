<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="click-clack logo: two horseshoe magnets clicking together">
  <title>click-clack</title>
  <desc>Two red horseshoe magnets with silver poles meeting at the center, with a spark burst depicting the click.</desc>

  <defs>
    <!-- Red magnet body gradient -->
    <linearGradient id="magnetRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#e74c3c"/>
      <stop offset="50%" stop-color="#c0392b"/>
      <stop offset="100%" stop-color="#8e2a20"/>
    </linearGradient>
    <!-- Silver pole gradient -->
    <linearGradient id="poleSilver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#f4f6f8"/>
      <stop offset="50%" stop-color="#c9ced3"/>
      <stop offset="100%" stop-color="#8a9097"/>
    </linearGradient>
    <!-- Spark gradient -->
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#fffbe6" stop-opacity="1"/>
      <stop offset="40%" stop-color="#ffe066" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffb703" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Left magnet (opening to the right) -->
  <g>
    <!-- Body -->
    <path d="M 190 40
             L 70 40
             A 60 60 0 0 0 70 160
             L 190 160
             L 190 120
             L 70 120
             A 20 20 0 0 1 70 80
             L 190 80 Z"
          fill="url(#magnetRed)" stroke="#4a160f" stroke-width="3" stroke-linejoin="round"/>
    <!-- Poles (silver tips) -->
    <rect x="168" y="40" width="22" height="40" fill="url(#poleSilver)" stroke="#4a160f" stroke-width="3"/>
    <rect x="168" y="120" width="22" height="40" fill="url(#poleSilver)" stroke="#4a160f" stroke-width="3"/>
    <!-- Pole labels -->
    <text x="179" y="67" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#2b2b2b">N</text>
    <text x="179" y="147" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#2b2b2b">S</text>
  </g>

  <!-- Right magnet (opening to the left, mirror of left) -->
  <g>
    <!-- Body -->
    <path d="M 210 40
             L 330 40
             A 60 60 0 0 1 330 160
             L 210 160
             L 210 120
             L 330 120
             A 20 20 0 0 0 330 80
             L 210 80 Z"
          fill="url(#magnetRed)" stroke="#4a160f" stroke-width="3" stroke-linejoin="round"/>
    <!-- Poles (silver tips) -->
    <rect x="210" y="40" width="22" height="40" fill="url(#poleSilver)" stroke="#4a160f" stroke-width="3"/>
    <rect x="210" y="120" width="22" height="40" fill="url(#poleSilver)" stroke="#4a160f" stroke-width="3"/>
    <!-- Pole labels -->
    <text x="221" y="67" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#2b2b2b">S</text>
    <text x="221" y="147" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#2b2b2b">N</text>
  </g>

  <!-- Spark bursts at the two contact points -->
  <g stroke="#f4a300" stroke-width="3" stroke-linecap="round" fill="none">
    <!-- Top contact (y=60) -->
    <line x1="200" y1="40" x2="200" y2="28"/>
    <line x1="200" y1="80" x2="200" y2="92"/>
    <line x1="188" y1="48" x2="180" y2="40"/>
    <line x1="212" y1="48" x2="220" y2="40"/>
    <line x1="188" y1="72" x2="180" y2="80"/>
    <line x1="212" y1="72" x2="220" y2="80"/>
    <!-- Bottom contact (y=140) -->
    <line x1="200" y1="120" x2="200" y2="108"/>
    <line x1="200" y1="160" x2="200" y2="172"/>
    <line x1="188" y1="128" x2="180" y2="120"/>
    <line x1="212" y1="128" x2="220" y2="120"/>
    <line x1="188" y1="152" x2="180" y2="160"/>
    <line x1="212" y1="152" x2="220" y2="160"/>
  </g>

  <!-- Soft glows at contact points -->
  <circle cx="200" cy="60" r="22" fill="url(#sparkGlow)"/>
  <circle cx="200" cy="140" r="22" fill="url(#sparkGlow)"/>

  <!-- Wordmark -->
  <text x="200" y="230"
        text-anchor="middle"
        font-family="Helvetica, Arial, sans-serif"
        font-size="40"
        font-weight="bold"
        fill="#2b2b2b"
        letter-spacing="1">click<tspan fill="#c0392b">-</tspan>clack</text>
</svg>
